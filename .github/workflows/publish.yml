name: Publish Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.10

      - name: Build sdist + wheel
        run: uv build

      - name: Load-check (all tools import)
        run: |
          uv pip install --system -e .
          python -c "import asyncio, gen_mcp_server.server as s; n=len(asyncio.run(s.mcp.list_tools())); assert n>0, 'no tools loaded'; print('tools:', n)"

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish
