[project]
name = "gen-mcp-server"
version = "1.1.0"
description = "DEPRECATED — the official GEN MCP is the hosted server at https://mcp.gen.pro (Authorization: Bearer <gen_PAT>). This is the FINAL PyPI release; no further versions will be published."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "gen", "gen-pro", "claude", "ai", "model-context-protocol"]
classifiers = [
    # The standard machine-readable "this package is retired" signal — PyPI
    # and dependency scanners surface it; humans get the README banner.
    "Development Status :: 7 - Inactive",
]
dependencies = [
    # <4: this is the FINAL PyPI release (GEN-4785) — it will never be updated
    # again, so an unbounded pin would let a future fastmcp major break fresh
    # installs of this package forever. Cap at the highest major verified
    # working (3.4.5, 2026-07-30: imports, all 143 tools load, list_tools()
    # public). NB 2.14.x privatized list_tools(), which the publish workflow's
    # load-check calls — another reason not to force a 2.x floor resolution.
    "fastmcp>=2.3.0,<4",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://gen.pro"
Repository = "https://github.com/poweredbyGEN/gen-mcp-server"

[project.scripts]
gen-mcp-server = "gen_mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gen_mcp_server"]
# The hosted deploy installs a wheel from the exact git SHA. Keep the vendored
# Rails artifact inside that wheel; otherwise source-tree tests pass while the
# deployed MCP cannot load its contract at import time.
include = ["src/gen_mcp_server/contracts/*.json"]
